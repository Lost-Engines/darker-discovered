<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="title"><title id="title">Coordinate reuse in model bytecode</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="370" fill="#101923" rx="6"/><text x="30" y="38" class="head" text-anchor="start">A rectangle in ten coordinate-command bytes</text><path d="M85,255 L285,255 L285,104 L85,104 Z" fill="#223d49" stroke="#8bc7bd" stroke-width="3" /><circle cx="85" cy="255" r="6" fill="#ebca80"/><text x="67" y="282" class="gold" text-anchor="start">0</text><circle cx="285" cy="255" r="6" fill="#ebca80"/><text x="267" y="282" class="gold" text-anchor="start">1</text><circle cx="285" cy="104" r="6" fill="#ebca80"/><text x="267" y="90" class="gold" text-anchor="start">2</text><circle cx="85" cy="104" r="6" fill="#ebca80"/><text x="67" y="90" class="gold" text-anchor="start">3</text><path d="M107,276 L260,276" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M308,233 L308,126" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M260,81 L109,81" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="186" y="191" class="mono" text-anchor="middle">C = 0</text><text x="380" y="110" class="mono" text-anchor="start">0   set C, A, B; emit</text><text x="380" y="157" class="mono" text-anchor="start">1   negate A; emit</text><text x="380" y="204" class="mono" text-anchor="start">2   negate B; emit</text><text x="380" y="251" class="mono" text-anchor="start">3   negate A; emit</text><text x="30" y="339" class="small" text-anchor="start">Only changed components need new transformed contributions.</text></svg>