<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="title"><title id="title">Stored tinted fountain reflection and authored paint order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="470" fill="#101923" rx="6"/><text x="30" y="37" class="head" text-anchor="start">The reflection is already in the model</text><path d="M50,235 H390" fill="none" stroke="#8bc7bd" stroke-width="5" /><text x="50" y="220" class="small" text-anchor="start">opaque water · height 384</text><circle cx="205" cy="118" r="25" fill="#eae7ef"/><path d="M177,148 L233,148 L242,205 L168,205 Z" fill="#8b7d87" stroke="#e4eced" stroke-width="1" /><circle cx="205" cy="352" r="25" fill="#7a6f97"/><path d="M177,322 L233,322 L242,265 L168,265 Z" fill="#524768" stroke="#e4eced" stroke-width="1" /><path d="M105,118 V352" fill="none" stroke="#ebca80" stroke-width="2" stroke-dasharray="4 5"/><text x="50" y="105" class="gold" text-anchor="start">608</text><text x="50" y="370" class="gold" text-anchor="start">160</text><text x="270" y="154" class="small" text-anchor="start">224 units</text><text x="270" y="320" class="small" text-anchor="start">224 units</text><text x="440" y="95" class="head" text-anchor="start">Command order</text><rect x="430" y="130" width="337" height="68" fill="#192a36" stroke="none" rx="4"/><text x="447" y="157" class="head" text-anchor="start">1. Paint water</text><text x="447" y="181" class="small" text-anchor="start">Opaque pool faces</text><path d="M598,201 L598,216" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="219" width="337" height="68" fill="#192a36" stroke="none" rx="4"/><text x="447" y="246" class="head" text-anchor="start">2. Paint reflection</text><text x="447" y="270" class="small" text-anchor="start">Stored mirrored points + tint</text><path d="M598,290 L598,305" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="308" width="337" height="68" fill="#192a36" stroke="none" rx="4"/><text x="447" y="335" class="head" text-anchor="start">3. Paint upper structure</text><text x="447" y="359" class="small" text-anchor="start">Pedestals, lamps, remaining faces</text><text x="30" y="432" class="small" text-anchor="start">No alpha blending. No reflected scene render. No per-pixel depth rejection.</text></svg>