<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="title"><title id="title">Source sheet transfers to the cockpit cache</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="430" fill="#101923" rx="6"/><text x="30" y="38" class="head" text-anchor="start">A source atlas is not a finished cockpit</text><text x="45" y="81" class="head" text-anchor="start">Source · 320 × 200</text><rect x="45" y="102" width="240" height="200" fill="#263746" stroke="#4b6473" rx="0"/><rect x="45" y="102" width="240" height="136" fill="#597b86" stroke="none" rx="0"/><rect x="45" y="198" width="240" height="104" fill="#a17a88" stroke="none" rx="0"/><rect x="45" y="198" width="240" height="40" fill="#c5b28e" stroke="none" rx="0"/><text x="59" y="130" class="" text-anchor="start">rows 0–135</text><text x="59" y="223" class="" text-anchor="start">overlap: 96–135</text><text x="59" y="280" class="" text-anchor="start">rows 96–199</text><text x="472" y="81" class="head" text-anchor="start">Cache · 320 × 240</text><rect x="472" y="102" width="240" height="240" fill="#192a36" stroke="#4b6473" rx="0"/><rect x="472" y="102" width="240" height="136" fill="#597b86" stroke="none" rx="0"/><rect x="472" y="238" width="240" height="104" fill="#a17a88" stroke="none" rx="0"/><text x="488" y="129" class="" text-anchor="start">rows 0–135</text><text x="488" y="279" class="" text-anchor="start">rows 136–239</text><path d="M293,148 L462,148" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M293,270 L462,301" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="371" class="small" text-anchor="start">The world uses its own clipped viewport.</text><text x="45" y="398" class="small" text-anchor="start">Masks then select cockpit edges, gauges and instrument pixels.</text></svg>