<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" role="img" aria-labelledby="title"><title id="title">Darker frame pipeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="680" fill="#101923" rx="6"/><text x="30" y="39" class="head" text-anchor="start">A frame, from world state to pixels</text><circle cx="53" cy="87" r="19" fill="#ebca80"/><text x="53" y="93" style="fill:#101923;font-weight:700" text-anchor="middle">1</text><rect x="88" y="62" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="86" class="head" text-anchor="start">Camera + world state</text><text x="106" y="108" class="small" text-anchor="start">Position, attitude, map, damage, light, clock</text><path d="M53,107 L53,132" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="162" r="19" fill="#ebca80"/><text x="53" y="168" style="fill:#101923;font-weight:700" text-anchor="middle">2</text><rect x="88" y="137" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="161" class="head" text-anchor="start">Background</text><text x="106" y="183" class="small" text-anchor="start">Draw the coloured sky and ground bands</text><path d="M53,182 L53,207" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="237" r="19" fill="#ebca80"/><text x="53" y="243" style="fill:#101923;font-weight:700" text-anchor="middle">3</text><rect x="88" y="212" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="236" class="head" text-anchor="start">Candidate cells</text><text x="106" y="258" class="small" text-anchor="start">Surface scan or underground visibility passes</text><path d="M53,257 L53,282" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="312" r="19" fill="#ebca80"/><text x="53" y="318" style="fill:#101923;font-weight:700" text-anchor="middle">4</text><rect x="88" y="287" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="311" class="head" text-anchor="start">Model placement</text><text x="106" y="333" class="small" text-anchor="start">Select linked forms; reject outside extents</text><path d="M53,332 L53,357" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="387" r="19" fill="#ebca80"/><text x="53" y="393" style="fill:#101923;font-weight:700" text-anchor="middle">5</text><rect x="88" y="362" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="386" class="head" text-anchor="start">Ordered draw records</text><text x="106" y="408" class="small" text-anchor="start">Background first; ordinary models far → near</text><path d="M53,407 L53,432" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="462" r="19" fill="#ebca80"/><text x="53" y="468" style="fill:#101923;font-weight:700" text-anchor="middle">6</text><rect x="88" y="437" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="461" class="head" text-anchor="start">Model programs</text><text x="106" y="483" class="small" text-anchor="start">Generate / transform / project points; emit primitives</text><path d="M53,482 L53,507" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="537" r="19" fill="#ebca80"/><text x="53" y="543" style="fill:#101923;font-weight:700" text-anchor="middle">7</text><rect x="88" y="512" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="536" class="head" text-anchor="start">Clip + rasterise</text><text x="106" y="558" class="small" text-anchor="start">Near plane and viewport; indexed spans, discs, sprites</text><path d="M53,557 L53,582" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="53" cy="612" r="19" fill="#ebca80"/><text x="53" y="618" style="fill:#101923;font-weight:700" text-anchor="middle">8</text><rect x="88" y="587" width="682" height="58" fill="#192a36" stroke="none" rx="5"/><text x="106" y="611" class="head" text-anchor="start">Cockpit + HUD → display</text><text x="106" y="633" class="small" text-anchor="start">Masked artwork and instruments; palette → colour</text></svg>