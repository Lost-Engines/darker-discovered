<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title"><title id="title">Perspective projection and near clipping plane</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="400" fill="#101923" rx="6"/><text x="30" y="38" class="head" text-anchor="start">Perspective: equal height, different screen size</text><path d="M55,290 L750,290" fill="none" stroke="#4b6473" stroke-width="2" /><text x="698" y="320" class="small" text-anchor="start">forward Z</text><path d="M220,65 L220,310" fill="none" stroke="#8bc7bd" stroke-width="3" /><text x="220" y="347" class="small" text-anchor="middle">image plane</text><path d="M135,65 L135,310" fill="none" stroke="#c993a6" stroke-width="2" stroke-dasharray="6 6"/><text x="135" y="375" class="small" text-anchor="middle">near plane</text><path d="M430,150 L430,290" fill="none" stroke="#e4eced" stroke-width="5" /><path d="M690,150 L690,290" fill="none" stroke="#e4eced" stroke-width="5" /><path d="M55,290 L430,150" fill="none" stroke="#ebca80" stroke-width="2" /><path d="M55,290 L690,150" fill="none" stroke="#ebca80" stroke-width="2" /><path d="M220,228.4 L220,290" fill="none" stroke="#ebca80" stroke-width="8" /><path d="M231,253.6 L231,290" fill="none" stroke="#c993a6" stroke-width="5" /><circle cx="55" cy="290" r="7" fill="#ebca80"/><text x="40" y="329" class="small" text-anchor="start">eye</text><text x="430" y="126" class="small" text-anchor="middle">near object</text><text x="690" y="126" class="small" text-anchor="middle">far object</text><text x="316" y="365" class="mono small" text-anchor="start">screen offset = focal length × height / depth</text></svg>