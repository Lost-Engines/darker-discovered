<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="title"><title id="title">Painter ordering of overlapping model instances</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ebca80"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e4eced;font-size:18px}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.mono{font-family:ui-monospace,monospace}.gold{fill:#ebca80}</style><rect width="800" height="390" fill="#101923" rx="6"/><text x="30" y="38" class="head" text-anchor="start">Later paint covers earlier pixels</text><rect x="28" y="64" width="234" height="178" fill="#1e1737" stroke="#4b6473" rx="0"/><rect x="28" y="187" width="234" height="55" fill="#20212b" stroke="none" rx="0"/><rect x="58" y="109" width="61" height="97" fill="#665968" stroke="none" rx="0"/><rect x="135" y="132" width="74" height="74" fill="#665968" stroke="none" rx="0"/><text x="145" y="272" class="" text-anchor="middle">1 · far silhouettes</text><rect x="283" y="64" width="234" height="178" fill="#1e1737" stroke="#4b6473" rx="0"/><rect x="283" y="187" width="234" height="55" fill="#20212b" stroke="none" rx="0"/><rect x="313" y="109" width="61" height="97" fill="#665968" stroke="none" rx="0"/><rect x="390" y="132" width="74" height="74" fill="#665968" stroke="none" rx="0"/><path d="M346,226 L346,152 L381,125 L438,152 L438,226 Z" fill="#938091" stroke="none" stroke-width="2" /><text x="400" y="272" class="" text-anchor="middle">2 · middle building</text><rect x="538" y="64" width="234" height="178" fill="#1e1737" stroke="#4b6473" rx="0"/><rect x="538" y="187" width="234" height="55" fill="#20212b" stroke="none" rx="0"/><rect x="568" y="109" width="61" height="97" fill="#665968" stroke="none" rx="0"/><rect x="645" y="132" width="74" height="74" fill="#665968" stroke="none" rx="0"/><path d="M601,226 L601,152 L636,125 L693,152 L693,226 Z" fill="#938091" stroke="none" stroke-width="2" /><rect x="655" y="174" width="104" height="68" fill="#c3a29e" stroke="none" rx="0"/><text x="655" y="272" class="" text-anchor="middle">3 · near structure</text><text x="30" y="317" class="head" text-anchor="start">One sort key per model is an approximation.</text><text x="30" y="349" class="small" text-anchor="start">If objects cross or form cyclic overlaps, no whole-object order may be correct.</text></svg>