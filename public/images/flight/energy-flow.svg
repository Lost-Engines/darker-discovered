<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title">
<title id="title">The Caero has separate working, weapon and boost stores</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ebca80"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#e4eced}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.gold{fill:#ebca80}</style>
<rect width="800" height="560" rx="6" fill="#101923"/><text x="28" y="38" class="head" text-anchor="start">Beacon power is used immediately and stored</text><rect x="270" y="61" width="260" height="72" fill="#192a36" rx="5"/><text x="400" y="91" class="head" text-anchor="middle">Current beacon input</text><text x="400" y="117" class="small" text-anchor="middle">admitted with engine on</text><path d="M400,133 L140,205" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,133 L400,205" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,133 L660,205" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="214" width="230" height="88" fill="#192a36" rx="5"/><text x="140" y="246" class="head" text-anchor="middle">Immediate effects</text><text x="140" y="277" class="small" text-anchor="middle">lift + next forward bias</text><rect x="285" y="214" width="230" height="88" fill="#192a36" rx="5"/><text x="400" y="246" class="head" text-anchor="middle">Working buffer</text><text x="400" y="277" class="small" text-anchor="middle">ordinary drive + transfer</text><rect x="545" y="214" width="230" height="88" fill="#192a36" rx="5"/><text x="660" y="246" class="head" text-anchor="middle">Stored boost</text><text x="660" y="277" class="small" text-anchor="middle">complete cells accumulate</text><path d="M400,302 L140,399" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,302 L400,399" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M660,302 L660,399" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="681" y="352" class="small" text-anchor="start">Enter</text><rect x="25" y="410" width="230" height="88" fill="#192a36" rx="5"/><text x="140" y="442" class="head" text-anchor="middle">Ordinary drive</text><text x="140" y="473" class="small" text-anchor="middle">buffer spent each update</text><rect x="285" y="410" width="230" height="88" fill="#192a36" rx="5"/><text x="400" y="442" class="head" text-anchor="middle">Weapon charge</text><text x="400" y="473" class="small" text-anchor="middle">limited by incoming power</text><rect x="545" y="410" width="230" height="88" fill="#192a36" rx="5"/><text x="660" y="442" class="head" text-anchor="middle">Active boost</text><text x="660" y="473" class="small" text-anchor="middle">temporary drive budget</text><text x="400" y="535" class="small" text-anchor="middle">Ordinary drive and active boost both feed forward demand.</text></svg>
