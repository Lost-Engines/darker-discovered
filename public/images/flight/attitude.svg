<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title">
<title id="title">Attitude and movement are different state</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ebca80"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#e4eced}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.gold{fill:#ebca80}</style>
<rect width="800" height="360" rx="6" fill="#101923"/><text x="28" y="38" class="head" text-anchor="start">Three angles; two movement components</text><rect x="25" y="65" width="230" height="204" fill="#192a36" rx="5"/><text x="140" y="95" class="" text-anchor="middle">Pitch · side view</text><rect x="285" y="65" width="230" height="204" fill="#192a36" rx="5"/><text x="400" y="95" class="" text-anchor="middle">Roll · front view</text><rect x="545" y="65" width="230" height="204" fill="#192a36" rx="5"/><text x="660" y="95" class="" text-anchor="middle">Heading · top view</text><path d="M55,195 H220" fill="none" stroke="#4b6473" stroke-width="2" stroke-dasharray="5 5"/><path d="M65,211 L205,154 L165,160 M65,211 L109,172" fill="none" stroke="#8bc7bd" stroke-width="5" /><path d="M172,195 Q175,172 188,161" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="140" y="247" class="small" text-anchor="middle">nose up / down</text><path d="M315,185 H485" fill="none" stroke="#4b6473" stroke-width="2" stroke-dasharray="5 5"/><path d="M323,213 L477,157" fill="none" stroke="#8bc7bd" stroke-width="5" /><circle cx="400" cy="185" r="10" fill="#8bc7bd"/><path d="M462,190 Q475,177 466,159" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="247" class="small" text-anchor="middle">bank left / right</text><path d="M660,205 V122" fill="none" stroke="#4b6473" stroke-width="2" stroke-dasharray="5 5"/><path d="M613,209 L702,138 L686,213 L659,188 Z" fill="none" stroke="#8bc7bd" stroke-width="4" /><path d="M661,129 Q681,125 699,136" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="247" class="small" text-anchor="middle">turn around the horizon</text><path d="M45,307 L190,307" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="211" y="313" class="small" text-anchor="start">horizontal motion</text><path d="M474,330 L474,287" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="497" y="313" class="small" text-anchor="start">climb / sink separately</text></svg>
