<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title">
<title id="title">A tunnel controller blends path following and manual steering</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ebca80"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#e4eced}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.gold{fill:#ebca80}</style>
<rect width="800" height="440" rx="6" fill="#101923"/><text x="28" y="38" class="head" text-anchor="start">Following a tunnel bend</text><path d="M40,351 Q204,351 204,201 Q204,101 417,101" fill="none" stroke="#4b6473" stroke-width="42" /><path d="M40,351 Q204,351 204,201 Q204,101 417,101" fill="none" stroke="#8bc7bd" stroke-width="2" stroke-dasharray="8 6"/><path d="M90,340 Q160,290 146,223 Q149,177 222,139" fill="none" stroke="#c993a6" stroke-width="2" stroke-dasharray="4 5"/><path d="M125,251 L170,200 L170,257 L147,240 Z" fill="none" stroke="#e4eced" stroke-width="3" /><path d="M164,224 L330,106" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><circle cx="330" cy="103" r="8" fill="#ebca80"/><text x="292" y="76" class="small" text-anchor="start">lookahead target</text><text x="60" y="396" class="small" text-anchor="start">Route centreline and offset craft</text><rect x="460" y="88" width="310" height="287" fill="#192a36" rx="5"/><text x="480" y="122" class="head" text-anchor="start">Each guided update</text><text x="480" y="166" class="small" text-anchor="start">1  Trace a path ahead</text><text x="480" y="205" class="small" text-anchor="start">2  Compare attitude to target</text><text x="480" y="244" class="small" text-anchor="start">3  Blend manual demand</text><text x="480" y="283" class="small" text-anchor="start">4  Reduce gain if opposed</text><text x="480" y="322" class="small" text-anchor="start">5  Deduct route resistance</text></svg>
