<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img" aria-labelledby="title">
<title id="title">Three flight controllers share the surrounding game loop</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#ebca80"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#e4eced}.small{font-size:15px;fill:#a9bbc4}.head{font-size:21px;font-weight:650}.gold{fill:#ebca80}</style>
<rect width="800" height="510" rx="6" fill="#101923"/><text x="28" y="38" class="head" text-anchor="start">Same inputs, different flight controllers</text><rect x="185" y="60" width="430" height="54" fill="#192a36" rx="5"/><text x="400" y="94" class="" text-anchor="middle">Keyboard / mouse → bank + pitch demand</text><path d="M400,114 L140,146" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="153" width="230" height="238" fill="#192a36" rx="5"/><text x="140" y="184" class="head" text-anchor="middle">Surface Caero</text><text x="140" y="222" class="small" text-anchor="middle">Angular response</text><text x="140" y="254" class="small" text-anchor="middle">Buffer + active boost</text><text x="140" y="286" class="small" text-anchor="middle">Horizontal movement</text><text x="140" y="318" class="small" text-anchor="middle">Sample one beacon</text><text x="140" y="350" class="small" text-anchor="middle">Charge + beacon lift</text><path d="M140,391 L140,424" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,114 L400,146" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="153" width="230" height="238" fill="#192a36" rx="5"/><text x="400" y="184" class="head" text-anchor="middle">Surface Skimma</text><text x="400" y="222" class="small" text-anchor="middle">Shield accumulation</text><text x="400" y="254" class="small" text-anchor="middle">Speed-dependent response</text><text x="400" y="286" class="small" text-anchor="middle">Selected drive setting</text><text x="400" y="318" class="small" text-anchor="middle">Horizontal movement</text><text x="400" y="350" class="small" text-anchor="middle">Speed-generated lift</text><path d="M400,391 L400,424" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,114 L660,146" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="153" width="230" height="238" fill="#192a36" rx="5"/><text x="660" y="184" class="head" text-anchor="middle">Underground Caero</text><text x="660" y="222" class="small" text-anchor="middle">Connection power</text><text x="660" y="254" class="small" text-anchor="middle">Smooth manual demand</text><text x="660" y="286" class="small" text-anchor="middle">Trace / reacquire route</text><text x="660" y="318" class="small" text-anchor="middle">Alignment + resistance</text><text x="660" y="350" class="small" text-anchor="middle">Route / slow aiming</text><path d="M660,391 L660,424" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="432" width="750" height="52" fill="#192a36" rx="5"/><text x="400" y="465" class="" text-anchor="middle">Integrate movement → collision and lifecycle → camera / render</text></svg>
