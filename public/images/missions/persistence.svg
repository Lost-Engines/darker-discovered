<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 355" width="880" height="355" role="img" aria-labelledby="title">
<title id="title">How city damage survives progression and retry</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5b2bc"/></marker></defs>
<rect width="880" height="355" fill="#101923"/>
<g font-family="system-ui,sans-serif"><text x="30" y="36" fill="#ebca80" font-size="18" text-anchor="start">SAVING THE CITY BETWEEN MISSIONS</text><rect x="30" y="70" width="235" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="147.5" y="99" fill="#94c8bf" font-size="19" text-anchor="middle">Committed city state</text><text x="147.5" y="125" fill="#a5b2bc" font-size="15" text-anchor="middle">two bits per eligible cell</text><path d="M270,107 L325,107" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="70" width="220" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="440.0" y="99" fill="#94c8bf" font-size="19" text-anchor="middle">Current attempt</text><text x="440.0" y="125" fill="#a5b2bc" font-size="15" text-anchor="middle">new damage + flags</text><path d="M553,107 L615,107" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="622" y="70" width="228" height="75" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="736.0" y="99" fill="#ebca80" font-size="19" text-anchor="middle">Successful return</text><text x="736.0" y="125" fill="#a5b2bc" font-size="15" text-anchor="middle">write updated city stream</text><path d="M440,148 L440,205" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="213" width="220" height="75" rx="5" fill="#1c2b33" stroke="#e59a9a"/><text x="440.0" y="242" fill="#e59a9a" font-size="19" text-anchor="middle">Failed attempt</text><text x="440.0" y="268" fill="#a5b2bc" font-size="15" text-anchor="middle">previous stream retained</text><path d="M330,250 L148,250" fill="none" stroke="#a5b2bc" stroke-width="2"/><path d="M148,250 L148,150" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="330" fill="#a5b2bc" font-size="18" text-anchor="start">Reload: original map + committed state + regenerated model variants</text></g></svg>
