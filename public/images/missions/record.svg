<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="title">
<title id="title">Components of a mission record</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5b2bc"/></marker></defs>
<rect width="880" height="440" fill="#101923"/>
<g font-family="system-ui,sans-serif"><text x="30" y="36" fill="#ebca80" font-size="18" text-anchor="start">ONE RECORD, SEVERAL JOBS</text><rect x="30" y="60" width="365" height="72" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="212.5" y="89" fill="#94c8bf" font-size="19" text-anchor="middle">Configuration</text><text x="212.5" y="115" fill="#a5b2bc" font-size="15" text-anchor="middle">craft · bank · map</text><path d="M400,96 L481,96" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="360" height="72" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="670.0" y="89" fill="#ebca80" font-size="19" text-anchor="middle">Load the world</text><rect x="30" y="149" width="365" height="72" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="212.5" y="178" fill="#94c8bf" font-size="19" text-anchor="middle">Beacon and cell lists</text><text x="212.5" y="204" fill="#a5b2bc" font-size="15" text-anchor="middle">fade queue · flags · objectives</text><path d="M400,185 L481,185" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="149" width="360" height="72" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="670.0" y="178" fill="#ebca80" font-size="19" text-anchor="middle">Prepare city state</text><rect x="30" y="238" width="365" height="72" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="212.5" y="267" fill="#94c8bf" font-size="19" text-anchor="middle">Object templates</text><text x="212.5" y="293" fill="#a5b2bc" font-size="15" text-anchor="middle">active · reserve · free</text><path d="M400,274 L481,274" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="238" width="360" height="72" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="670.0" y="267" fill="#ebca80" font-size="19" text-anchor="middle">Populate object lists</text><rect x="30" y="327" width="365" height="72" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="212.5" y="356" fill="#94c8bf" font-size="19" text-anchor="middle">Scripts + language sections</text><text x="212.5" y="382" fill="#a5b2bc" font-size="15" text-anchor="middle">entry points · commands · text</text><path d="M400,363 L481,363" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="327" width="360" height="72" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="670.0" y="356" fill="#ebca80" font-size="19" text-anchor="middle">Present and run the mission</text><text x="30" y="426" fill="#a5b2bc" font-size="16" text-anchor="start">The player and other objects retain their own script continuations during flight.</text></g></svg>
