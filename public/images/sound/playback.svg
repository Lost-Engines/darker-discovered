<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-labelledby="title">
<title id="title">The music playback path</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5b2bc"/></marker></defs>
<rect width="880" height="410" fill="#101923"/>
<g font-family="system-ui,sans-serif"><text x="30" y="37" fill="#ebca80" font-size="18" text-anchor="start">FROM MUSIC RESOURCE TO AUDIO</text><rect x="30" y="68" width="240" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="150.0" y="97" fill="#94c8bf" font-size="19" text-anchor="middle">Arrangement</text><text x="150.0" y="123" fill="#a5b2bc" font-size="15" text-anchor="middle">notes · waits · loop pointers</text><path d="M272,105 L324,105" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="68" width="235" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="447.5" y="97" fill="#94c8bf" font-size="19" text-anchor="middle">Timed interpreter</text><text x="447.5" y="123" fill="#a5b2bc" font-size="15" text-anchor="middle">tempo + per-part state</text><path d="M568,105 L619,105" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="68" width="225" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="737.5" y="97" fill="#94c8bf" font-size="19" text-anchor="middle">Device events</text><text x="737.5" y="123" fill="#a5b2bc" font-size="15" text-anchor="middle">registers / MIDI / API</text><path d="M738,146 L738,197" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="205" width="225" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="737.5" y="234" fill="#94c8bf" font-size="19" text-anchor="middle">Synthesiser</text><text x="737.5" y="260" fill="#a5b2bc" font-size="15" text-anchor="middle">chip state → samples</text><path d="M621,242 L572,242" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="205" width="235" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="447.5" y="234" fill="#94c8bf" font-size="19" text-anchor="middle">Audio output</text><text x="447.5" y="260" fill="#a5b2bc" font-size="15" text-anchor="middle">48 kHz emulated renders</text><rect x="30" y="205" width="240" height="75" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="150.0" y="234" fill="#94c8bf" font-size="19" text-anchor="middle">Instrument data</text><text x="150.0" y="260" fill="#a5b2bc" font-size="15" text-anchor="middle">FM patches · ROM · GUS RAM</text><path d="M150,282 L150,325" fill="none" stroke="#a5b2bc" stroke-width="2"/><path d="M150,325 L738,325" fill="none" stroke="#a5b2bc" stroke-width="2"/><path d="M738,325 L738,284" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="380" fill="#a5b2bc" font-size="17" text-anchor="start">The selected driver determines both the arrangement and its route to the hardware.</text></g></svg>
