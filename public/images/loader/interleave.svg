<rect width="880" height="410" fill="#101923"/>
<g font-family="system-ui,sans-serif"><text x="30" y="36" fill="#ebca80" font-size="18" text-anchor="start">INTERRUPT 1 SWITCHES THE STREAM</text><text x="145" y="80" fill="#94c8bf" font-size="20" text-anchor="middle">Stream A</text><rect x="50" y="100" width="190" height="62" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="145.0" y="129" fill="#94c8bf" font-size="19" text-anchor="middle">A0</text><rect x="50" y="190" width="190" height="62" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="145.0" y="219" fill="#94c8bf" font-size="19" text-anchor="middle">A1</text><rect x="50" y="280" width="190" height="62" rx="5" fill="#1c2b33" stroke="#94c8bf"/><text x="145.0" y="309" fill="#94c8bf" font-size="19" text-anchor="middle">A2</text><text x="725" y="80" fill="#ebca80" font-size="20" text-anchor="middle">Stream B</text><rect x="630" y="100" width="190" height="62" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="725.0" y="129" fill="#ebca80" font-size="19" text-anchor="middle">B0</text><rect x="630" y="190" width="190" height="62" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="725.0" y="219" fill="#ebca80" font-size="19" text-anchor="middle">B1</text><rect x="630" y="280" width="190" height="62" rx="5" fill="#1c2b33" stroke="#ebca80"/><text x="725.0" y="309" fill="#ebca80" font-size="19" text-anchor="middle">B2</text><path d="M243,131 L625,131" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M625,158 L245,221" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M243,242 L625,242" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M625,269 L245,311" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M243,332 L625,332" fill="none" stroke="#a5b2bc" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="114" fill="#a5b2bc" font-size="17" text-anchor="middle">saved IP ↔ SI</text><text x="435" y="387" fill="#a5b2bc" font-size="17" text-anchor="middle">Each stream resumes at its saved next-instruction address.</text></g></svg>
