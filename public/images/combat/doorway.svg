<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="title">
<title id="title">Schematic of protected office walls and a vulnerable entrance</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5b2bc"/></marker></defs>
<rect width="880" height="390" fill="#101923"/>
<g font-family="system-ui,sans-serif"><text x="30" y="36" fill="#ebca80" font-size="18" text-anchor="start">AN OFFICE ENTRANCE: TWO APPROACHES</text><text x="220" y="77" fill="#a5b2bc" font-size="17" text-anchor="middle">Plan / cut through doorway</text><text x="655" y="77" fill="#a5b2bc" font-size="17" text-anchor="middle">Side section</text><path d="M55 115 H385 V292 H245 V246 H195 V292 H55 Z" fill="#493e4d" stroke="#e59a9a" stroke-width="2"/><rect x="195" y="228" width="50" height="18" fill="#94c8bf"/><path d="M115,348 L115,295" fill="none" stroke="#e59a9a" stroke-width="4" marker-end="url(#arrow)"/><path d="M220,348 L220,249" fill="none" stroke="#94c8bf" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="370" fill="#e59a9a" font-size="15" text-anchor="start">Protected wall</text><text x="238" y="326" fill="#94c8bf" font-size="15" text-anchor="start">Through entrance</text><path d="M490 115 H820 V290 H700 V246 H490 Z" fill="#493e4d" stroke="#e59a9a" stroke-width="2"/><rect x="684" y="246" width="16" height="44" fill="#94c8bf"/><path d="M490,292 L830,292" fill="none" stroke="#a5b2bc" stroke-width="2"/><path d="M500,271 L681,271" fill="none" stroke="#94c8bf" stroke-width="4" marker-end="url(#arrow)"/><text x="654" y="331" fill="#94c8bf" font-size="17" text-anchor="middle">Thin vulnerable volume</text><text x="654" y="356" fill="#a5b2bc" font-size="17" text-anchor="middle">behind the opening</text></g></svg>
